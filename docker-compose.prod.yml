# ═══════════════════════════════════════════════════════
#  VetCare Platform - Production Docker Compose
#  Usage: docker compose -f docker-compose.prod.yml up -d
#  Requires: .env file with production secrets
# ═══════════════════════════════════════════════════════
version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vetcare_db
    environment:
      POSTGRES_USER: ${DB_USER:-vetcare_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-veterinary_consultation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vetcare_app} -d ${DB_NAME:-veterinary_consultation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    # NOT exposed to host - only accessible from backend-net

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vetcare_cache
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    # NOT exposed to host

  # ── Backend API ─────────────────────────────────────
  backend:
    image: ${DOCKER_REGISTRY:-vetcare}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vetcare_api
    environment:
      NODE_ENV: production
      PORT: 3000
      MOCK_DB: "false"
      MOCK_REDIS: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vetcare_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME:-veterinary_consultation}
      DB_POOL_MIN: 5
      DB_POOL_MAX: 30
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://your-domain.com}
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: warn
      # Feature flags
      FEATURE_REDIS_CACHE: "true"
      FEATURE_PAYMENTS: "false"
      FEATURE_EMAIL_NOTIFICATIONS: "false"
      FEATURE_FILE_STORAGE: "false"
      FEATURE_REALTIME_CHAT: "true"
      FEATURE_OAUTH_SSO: "false"
      FEATURE_TWO_FACTOR_AUTH: "false"
      FEATURE_AUDIT_LOGGING: "true"
      FEATURE_ADVANCED_RATE_LIMITING: "true"
      FEATURE_ANALYTICS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - backend-net
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    # NOT exposed to host - nginx proxies to it

  # ── Frontend (Nginx) ───────────────────────────────
  frontend:
    image: ${DOCKER_REGISTRY:-vetcare}/frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: vetcare_web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend-net:
    driver: bridge
    internal: true          # No external access - DB/Redis isolated
  frontend-net:
    driver: bridge          # Frontend + Backend communicate here
