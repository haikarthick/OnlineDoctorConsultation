name: Promote DEV to PROD

# Manual workflow to promote code from develop → main (production)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm promotion to production'
        required: true
        type: string

jobs:
  promote:
    name: Merge develop → main (production)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into main
        run: |
          git fetch origin develop main
          git checkout main
          git merge origin/develop --no-edit -m "promote: develop → main (production)"
          git push origin main
          echo "✅ Successfully promoted develop → main"
