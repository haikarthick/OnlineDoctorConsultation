name: Promote to Next Environment

# Manual workflow to promote code between environments:
#   develop → test → demo → main (production)
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source environment branch'
        required: true
        type: choice
        options:
          - develop
          - test
          - demo
      target:
        description: 'Target environment branch'
        required: true
        type: choice
        options:
          - test
          - demo
          - main

jobs:
  validate:
    name: Validate Promotion Path
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Check valid promotion path
        id: check
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          TARGET="${{ github.event.inputs.target }}"

          # Only allow sequential promotions
          VALID="false"
          if [ "$SOURCE" = "develop" ] && [ "$TARGET" = "test" ]; then VALID="true"; fi
          if [ "$SOURCE" = "test" ] && [ "$TARGET" = "demo" ]; then VALID="true"; fi
          if [ "$SOURCE" = "demo" ] && [ "$TARGET" = "main" ]; then VALID="true"; fi

          echo "valid=$VALID" >> "$GITHUB_OUTPUT"

          if [ "$VALID" = "false" ]; then
            echo "❌ Invalid promotion: $SOURCE → $TARGET"
            echo "   Allowed: develop→test, test→demo, demo→main"
            exit 1
          fi

          echo "✅ Valid promotion: $SOURCE → $TARGET"

  promote:
    name: Merge ${{ github.event.inputs.source }} → ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Perform merge
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          TARGET="${{ github.event.inputs.target }}"

          git fetch origin "$SOURCE" "$TARGET"
          git checkout "$TARGET"
          git merge "origin/$SOURCE" --no-edit -m "promote: $SOURCE → $TARGET [skip ci]"
          git push origin "$TARGET"

          echo "✅ Successfully promoted $SOURCE → $TARGET"
