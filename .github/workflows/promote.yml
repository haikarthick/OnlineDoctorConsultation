name: Promote DEV to Demo

# Manual workflow to promote code from develop → demo
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm promotion to Demo environment'
        required: true
        type: string

jobs:
  promote:
    name: Merge develop → demo
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into demo
        run: |
          git fetch origin develop demo
          git checkout demo
          git merge origin/develop --no-edit -m "promote: develop → demo"
          git push origin demo
          echo "✅ Successfully promoted develop → demo"
