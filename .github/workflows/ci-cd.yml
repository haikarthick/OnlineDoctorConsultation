name: CI/CD Pipeline — Build, Test & Deploy

on:
  push:
    branches: [develop, test, demo, main]
  pull_request:
    branches: [develop, test, demo, main]

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}/vetcare
  NODE_VERSION: '18'

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════
  #  1. Backend — Lint + Test + Coverage
  # ═════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veterinary_consultation
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: veterinary_consultation
          REDIS_HOST: localhost

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  # ═════════════════════════════════════════════
  #  2. Frontend — Lint + Build + TypeCheck
  # ═════════════════════════════════════════════
  frontend-test:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ═════════════════════════════════════════════
  #  3. Security Scan (Trivy)
  # ═════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

  # ═════════════════════════════════════════════
  #  4. Determine Target Environment
  # ═════════════════════════════════════════════
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push'
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy_url: ${{ steps.env.outputs.deploy_url }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            develop)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "deploy_url=https://vetcare-dev.onrender.com" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            test)
              echo "environment=test" >> "$GITHUB_OUTPUT"
              echo "deploy_url=https://vetcare-test.onrender.com" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            demo)
              echo "environment=demo" >> "$GITHUB_OUTPUT"
              echo "deploy_url=https://vetcare-demo.onrender.com" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "deploy_url=https://vetcare-app.onrender.com" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "environment=none" >> "$GITHUB_OUTPUT"
              echo "deploy_url=" >> "$GITHUB_OUTPUT"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ═════════════════════════════════════════════
  #  5. Deploy to Target Environment (Render.com)
  # ═════════════════════════════════════════════
  deploy:
    name: Deploy to ${{ needs.resolve-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [security-scan, resolve-env]
    if: needs.resolve-env.outputs.should_deploy == 'true'
    environment:
      name: ${{ needs.resolve-env.outputs.environment }}
      url: ${{ needs.resolve-env.outputs.deploy_url }}

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          echo "🚀 Deploying to $ENV environment..."

          # Each environment has its own Render deploy hook secret
          # Set these in GitHub repo Settings → Secrets:
          #   RENDER_DEPLOY_HOOK_DEV
          #   RENDER_DEPLOY_HOOK_TEST
          #   RENDER_DEPLOY_HOOK_DEMO
          #   RENDER_DEPLOY_HOOK_PROD
          case "$ENV" in
            dev)   HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_DEV }}" ;;
            test)  HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_TEST }}" ;;
            demo)  HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_DEMO }}" ;;
            production) HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" ;;
          esac

          if [ -z "$HOOK_URL" ]; then
            echo "⚠️  No deploy hook configured for $ENV — skipping deployment."
            echo "    Set the RENDER_DEPLOY_HOOK_$(echo $ENV | tr a-z A-Z) secret in GitHub."
            exit 0
          fi

          curl -sf "$HOOK_URL" || { echo "❌ Deploy trigger failed"; exit 1; }
          echo "✅ Deploy triggered for $ENV"

      - name: Post-deploy health check
        if: needs.resolve-env.outputs.deploy_url != ''
        run: |
          URL="${{ needs.resolve-env.outputs.deploy_url }}"
          echo "⏳ Waiting 120s for $URL to come up..."
          sleep 120
          for i in 1 2 3 4 5; do
            if curl -sf "$URL/api/v1/health" > /dev/null 2>&1; then
              echo "✅ Health check passed on attempt $i"
              exit 0
            fi
            echo "  Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "⚠️  Health check did not pass (Render free tier may still be spinning up)"
          exit 0

  # ═════════════════════════════════════════════
  #  6. Build & Push Docker Images (main only)
  # ═════════════════════════════════════════════
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/backend:latest
            ${{ env.DOCKER_REGISTRY }}/backend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/frontend:latest
            ${{ env.DOCKER_REGISTRY }}/frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
            echo "Deployment successful!"
            docker image prune -f
