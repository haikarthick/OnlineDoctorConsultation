name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [develop, demo]
  pull_request:
    branches: [develop, demo]

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}/vetcare
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════
  #  1. Backend - Lint + Test + Coverage
  # ═════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veterinary_consultation
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: veterinary_consultation
          REDIS_HOST: localhost

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  # ═════════════════════════════════════════════
  #  2. Frontend - Lint + Build + TypeCheck
  # ═════════════════════════════════════════════
  frontend-test:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      # Harness rule H1 (docs/HARNESS.md): these two were never run in CI before, so the
      # error-message guard, locale parity, routing, translation-key and shared-control tests
      # protected nothing. Same commands as the local pre-push gate.
      - name: Lint (errors only)
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --quiet

      - name: Unit + guard tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ═════════════════════════════════════════════
  #  2a. Runtime Verification - the only job that RUNS anything
  # ═════════════════════════════════════════════
  # Every other job here is static: lint, jest-with-mocks, tsc, vite build. None of them
  # execute a line of SQL or boot the server - which is exactly how a fully broken feature
  # shipped green on 2026-07-27. The local pre-push hook runs this same gate, but a hook can
  # be bypassed with `git push --no-verify`; this job is what makes it unskippable, and
  # `resolve-env` (which gates deploy) depends on it.
  #
  # See docs/VERIFICATION.md and backend/scripts/runtime-verify.js.
  runtime-verify:
    name: Runtime Verification (${{ matrix.mode }})
    # Pinned, not ubuntu-latest: that rolls forward on its own schedule, and the pinned
    # @playwright/test version doesn't support `--with-deps` on every new release the moment it
    # lands (broke silently when runners moved to ubuntu26.04 - see the 2026-11-13 CI-repair
    # commit). Bump this deliberately alongside a Playwright upgrade, not by GitHub's default.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production behaviour: the legacy startup self-heal runs, as it does on Render today.
          - mode: self-heal on
            disable_selfheal: ''
          # The retirement check. Proves docker/init.sql + backend/migrations are SUFFICIENT on
          # their own for a fresh database. If someone adds schema only to database.ts's
          # self-heal - which the file's own header forbids - this leg goes red while the other
          # stays green, which names the mistake precisely.
          - mode: self-heal OFF (migrations must suffice)
            disable_selfheal: 'true'
    env:
      DISABLE_LEGACY_SELFHEAL: ${{ matrix.disable_selfheal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The harness creates its OWN throwaway cluster with initdb (so it can control the exact
      # startup sequence), which needs the postgresql SERVER package, not just the client.
      # initdb refuses to run as root - GitHub runners execute as the non-root `runner` user.
      - name: Install PostgreSQL server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          ls /usr/lib/postgresql/

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # NODE_ENV=production for the BUILDS only, mirroring render-build.sh.
      - name: Build backend
        working-directory: backend
        run: NODE_ENV=production npm run build

      - name: Build frontend
        working-directory: frontend
        run: NODE_ENV=production npm run build

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run runtime verification
        working-directory: backend
        run: npm run verify:runtime

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Must be unique per matrix leg - two jobs uploading the same artifact name collide.
          name: runtime-verify-playwright-${{ strategy.job-index }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ═════════════════════════════════════════════
  #  2b. E2E Route Coverage Check
  # ═════════════════════════════════════════════
  e2e-coverage:
    name: E2E Route Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check all routes have E2E tests
        working-directory: frontend
        run: node e2e/generate-tests.cjs

  # (The full legacy E2E suite is NOT part of this pipeline any more: it lives in e2e-full.yml, nightly.
  #  It is informational and takes ~25 minutes; as a job here, every newer push cancelled it, which made
  #  the whole run "cancelled" and kept the commit from ever having passing CI checks - and Render only
  #  auto-deploys a commit whose checks pass. See docs/VERIFICATION.md.)

  # ═════════════════════════════════════════════
  #  3. Security Scan (Trivy)
  # ═════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-coverage]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

  # ═════════════════════════════════════════════
  #  4. Determine Target Environment
  # ═════════════════════════════════════════════
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    # runtime-verify is a hard dependency: no deploy may proceed on a build whose schema,
    # server boot and critical UI journeys have not actually been executed.
    needs: [backend-test, frontend-test, runtime-verify]
    if: github.event_name == 'push'
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy_url: ${{ steps.env.outputs.deploy_url }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            develop)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "deploy_url=https://vetcare-dev.onrender.com" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            demo)
              echo "environment=demo" >> "$GITHUB_OUTPUT"
              echo "deploy_url=https://vetcare-demo.onrender.com" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "environment=none" >> "$GITHUB_OUTPUT"
              echo "deploy_url=" >> "$GITHUB_OUTPUT"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ═════════════════════════════════════════════
  #  5. Deploy to Target Environment (Render.com)
  # ═════════════════════════════════════════════
  deploy:
    name: Deploy to ${{ needs.resolve-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [security-scan, resolve-env]
    if: needs.resolve-env.outputs.should_deploy == 'true'
    environment:
      name: ${{ needs.resolve-env.outputs.environment }}
      url: ${{ needs.resolve-env.outputs.deploy_url }}

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          echo "🚀 Deploying to $ENV environment..."

          # Each environment has its own Render deploy hook secret
          # Set these in GitHub repo Settings → Secrets:
          #   RENDER_DEPLOY_HOOK_DEV
          #   RENDER_DEPLOY_HOOK_DEMO
          case "$ENV" in
            dev)   HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_DEV }}" ;;
            demo)  HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_DEMO }}" ;;
          esac

          if [ -z "$HOOK_URL" ]; then
            echo "::warning title=No Render deploy hook::Set the RENDER_DEPLOY_HOOK_$(echo $ENV | tr a-z A-Z) secret. Nothing was deployed by this job; Render's own auto-deploy (if enabled) is the only trigger."
            echo "⚠️  No deploy hook configured for $ENV - skipping deployment."
            echo "    Set the RENDER_DEPLOY_HOOK_$(echo $ENV | tr a-z A-Z) secret in GitHub."
            exit 0
          fi

          curl -sf "$HOOK_URL" || { echo "❌ Deploy trigger failed"; exit 1; }
          echo "✅ Deploy triggered for $ENV"

      - name: Post-deploy health check
        if: needs.resolve-env.outputs.deploy_url != ''
        run: |
          URL="${{ needs.resolve-env.outputs.deploy_url }}"
          echo "Waiting 120s for $URL to come up..."
          sleep 120
          LAST=""
          for i in 1 2 3 4 5 6; do
            LAST=$(curl -s -m 30 "$URL/api/v1/health" || true)
            # The deployed app must report its schema contract: every column/table the
            # migrations promise exists. A drift here is exactly the "column does not exist"
            # error users hit on 2026-11-19 while the old check still said healthy.
            if echo "$LAST" | grep -q '"schemaContract":"drift"'; then
              echo "::error title=Database schema drift::$LAST"
              exit 1
            fi
            if echo "$LAST" | grep -q '"schemaContract":"ok"'; then
              echo "Health check passed on attempt $i - schema contract ok"
              exit 0
            fi
            echo "  Attempt $i: no schemaContract=ok yet (still deploying?), retrying in 30s..."
            sleep 30
          done
          echo "::warning title=Schema contract not confirmed::Last health response: $LAST"
          exit 0

      - name: Post-deploy write-path smoke (publishes and deletes a real listing)
        if: needs.resolve-env.outputs.deploy_url != ''
        uses: actions/checkout@v4

      - name: Run write-path smoke
        if: needs.resolve-env.outputs.deploy_url != ''
        run: node backend/scripts/post-deploy-smoke.js "${{ needs.resolve-env.outputs.deploy_url }}"

  # ═════════════════════════════════════════════
  #  6. Build & Push Docker Images (main only)
  # ═════════════════════════════════════════════
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/backend:latest
            ${{ env.DOCKER_REGISTRY }}/backend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/frontend:latest
            ${{ env.DOCKER_REGISTRY }}/frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
