name: Uptime Monitor — Keep Demo & Dev Warm

# Pings both Render services every 5 minutes to prevent free-tier spin-down.
# Render free tier spins down after 15 min of inactivity.
# Neon free tier suspends compute after 5 min of inactivity.
# Pinging every 5 min keeps BOTH warm.

on:
  schedule:
    # Every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to ping (both, demo, dev)'
        required: false
        default: 'both'
        type: choice
        options: [both, demo, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ping-demo:
    name: Ping Demo
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'both' || github.event.inputs.environment == 'demo'
    steps:
      - name: Ping vetcare-demo health endpoint
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M UTC') — Pinging vetcare-demo..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 45 \
            "https://vetcare-demo.onrender.com/api/v1/health" || echo "000")
          echo "  Response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "  ✅ Demo is alive (HTTP $HTTP_CODE)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "  ⚠️  Demo timed out or unreachable (cold start in progress — normal)"
          else
            echo "  ❌ Demo returned unexpected status: $HTTP_CODE"
          fi

  ping-dev:
    name: Ping Dev
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'both' || github.event.inputs.environment == 'dev'
    steps:
      - name: Ping vetcare-dev health endpoint
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M UTC') — Pinging vetcare-dev..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 45 \
            "https://vetcare-dev.onrender.com/api/v1/health" || echo "000")
          echo "  Response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "  ✅ Dev is alive (HTTP $HTTP_CODE)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "  ⚠️  Dev timed out or unreachable (cold start in progress — normal)"
          else
            echo "  ❌ Dev returned unexpected status: $HTTP_CODE"
          fi
