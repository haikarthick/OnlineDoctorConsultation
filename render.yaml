# ─────────────────────────────────────────────────────────────
# Render.com Blueprint  —  Two-Environment Setup
# ─────────────────────────────────────────────────────────────
# DEV  → branch: develop → vetcare-dev  → schema: vetcare_dev  → Render Postgres
# DEMO → branch: demo    → vetcare-demo → schema: vetcare_demo → Neon PostgreSQL
#
# DATABASE_URL for vetcare-demo is set via GitHub Actions (setup-demo-env.yml)
# using the Render API — do NOT add fromDatabase here for demo.
#
# To apply:
#   1. Go to https://dashboard.render.com/select-repo?type=blueprint
#   2. Select this repo → click "Apply"
# ─────────────────────────────────────────────────────────────

databases:
  - name: vetcare-db
    plan: free
    databaseName: vetcare
    user: vetcare

services:
  # ── DEV Environment ─────────────────────────────────────
  - type: web
    name: vetcare-dev
    runtime: node
    plan: free
    branch: develop
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare-db
          property: connectionString
      - key: DB_SCHEMA
        value: vetcare_dev
      - key: NODE_ENV
        value: development
      - key: SEED_ON_STARTUP
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ── DEMO Environment ────────────────────────────────────
  # DATABASE_URL is Neon PostgreSQL — set via GitHub Actions setup-demo-env.yml
  # All sensitive env vars managed via GitHub Secrets → Render API
  - type: web
    name: vetcare-demo
    runtime: node
    plan: free
    branch: demo
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      - key: DB_SCHEMA
        value: vetcare_demo
      - key: NODE_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
