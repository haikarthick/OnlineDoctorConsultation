# ─────────────────────────────────────────────────────────────
# Render.com Blueprint  —  Free-Tier Setup (1 DB, 2 Services)
# ─────────────────────────────────────────────────────────────
# Uses ONE free PostgreSQL database with schema-based separation:
#   DEV  → branch: develop → vetcare-dev  → schema: vetcare_dev
#   PROD → branch: main    → vetcare-app  → schema: vetcare_prod
#
# To apply:
#   1. Go to https://dashboard.render.com/select-repo?type=blueprint
#   2. Select this repo → click "Apply"
#   3. All 3 resources are created in one click
# ─────────────────────────────────────────────────────────────

databases:
  - name: vetcare-db
    plan: free
    databaseName: vetcare
    user: vetcare

services:
  # ── DEV Environment ─────────────────────────────────────
  - type: web
    name: vetcare-dev
    runtime: node
    plan: free
    branch: develop
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare-db
          property: connectionString
      - key: DB_SCHEMA
        value: vetcare_dev
      - key: NODE_ENV
        value: development
      - key: SEED_ON_STARTUP
        value: "true"
      - key: GROQ_API_KEY
        sync: false

  # ── PROD Environment ────────────────────────────────────
  - type: web
    name: vetcare-app
    runtime: node
    plan: free
    branch: main
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare-db
          property: connectionString
      - key: DB_SCHEMA
        value: vetcare_prod
      - key: NODE_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "false"
      - key: GROQ_API_KEY
        sync: false
