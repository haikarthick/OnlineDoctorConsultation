# ─────────────────────────────────────────────────────────────
# Render.com Blueprint  —  Two-Environment Setup
# ─────────────────────────────────────────────────────────────
# DEV  → branch: develop → vetcare-dev  → schema: vetcare_dev  → Render Postgres
# DEMO → branch: demo    → vetcare-demo → schema: vetcare_demo → Neon PostgreSQL
#
# DATABASE_URL for vetcare-demo is set via GitHub Actions (setup-demo-env.yml)
# using the Render API — do NOT add fromDatabase here for demo.
#
# To apply:
#   1. Go to https://dashboard.render.com/select-repo?type=blueprint
#   2. Select this repo → click "Apply"
# ─────────────────────────────────────────────────────────────

databases:
  - name: vetcare-db
    plan: free
    databaseName: vetcare
    user: vetcare

services:
  # ── DEV Environment ─────────────────────────────────────
  - type: web
    name: vetcare-dev
    runtime: node
    plan: free
    branch: develop
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      # Pin Node to the version CI builds+tests on (Node 20). Unpinned, Render picks its own
      # default which can differ from the proven-good CI/local envs and cause build/runtime drift.
      # Also pinned via .nvmrc (which Render reads automatically each build). See lessons: deploy-safety.
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare-db
          property: connectionString
      - key: DB_SCHEMA
        value: vetcare_dev
      - key: NODE_ENV
        value: development
      - key: SEED_ON_STARTUP
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Razorpay Key Id/Secret/Webhook Secret are stored encrypted in the DB
      # (payment_gateway_credentials, set via Admin -> System Settings ->
      # Razorpay Credentials) -- this is the only secret still needed from
      # env, it decrypts them. One value, reusable if this DB is ever cloned
      # to a new deploy target.
      - key: PAYMENT_CREDENTIALS_KEY
        sync: false
      # Set STORAGE_DRIVER=cloudinary to enable Cloudinary-backed marketplace
      # image/video uploads (fixes images/video vanishing on every deploy —
      # Render's free-tier disk is ephemeral). Requires CLOUDINARY_URL
      # (cloudinary://<api_key>:<api_secret>@<cloud_name>, from the Cloudinary
      # dashboard) to also be set below. Leave STORAGE_DRIVER unset/'local' to
      # keep the previous (broken-on-restart) behavior.
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false

  # ── DEMO Environment ────────────────────────────────────
  # DATABASE_URL is Neon PostgreSQL — set via GitHub Actions setup-demo-env.yml
  # All sensitive env vars managed via GitHub Secrets → Render API
  - type: web
    name: vetcare-demo
    runtime: node
    plan: free
    branch: demo
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_SCHEMA
        value: vetcare_demo
      - key: NODE_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Was missing on demo — CLOUDINARY_URL alone does nothing without this; the storage
      # driver defaulted to 'local' (Render's ephemeral disk), so demo marketplace
      # images/video were still being silently wiped on every deploy even after the
      # Cloudinary migration shipped for dev. See STORAGE_DRIVER comment on vetcare-dev above.
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
