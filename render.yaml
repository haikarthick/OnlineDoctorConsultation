# ─────────────────────────────────────────────────────────────
# Render.com Blueprint  —  Multi-Environment Setup
# ─────────────────────────────────────────────────────────────
# Each environment is a separate Render Web Service + Database.
# Create each by pointing Render to the correct branch:
#
#   DEV  → branch: develop   → vetcare-dev
#   TEST → branch: test      → vetcare-test
#   DEMO → branch: demo      → vetcare-demo
#   PROD → branch: main      → vetcare-app
#
# To deploy: push/merge to the target branch, or use the
# GitHub Actions "Promote" workflow to move code forward.
# ─────────────────────────────────────────────────────────────

databases:
  - name: vetcare-db
    plan: free
    databaseName: vetcare
    user: vetcare

services:
  - type: web
    name: vetcare-app
    runtime: node
    plan: free
    branch: main
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      #    at startup. Only DATABASE_URL must come from Render
      #    because the DB credentials are generated at deploy time.
