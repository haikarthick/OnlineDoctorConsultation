<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="VetCare - Complete veterinary telemedicine platform for pet owners, farmers, and veterinarians" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VetCare" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#667eea" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <title>VetCare - Veterinary Consultation Platform</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      /* iOS safe area support */
      body {
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fef2f2;border-top:2px solid #dc2626;padding:12px 20px;font-family:monospace;font-size:13px;color:#991b1b;z-index:99999;max-height:200px;overflow:auto"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('error-overlay');
        if (el) { el.style.display = 'block'; el.innerHTML += '<div><b>Error:</b> ' + msg + ' at ' + src + ':' + line + '</div>'; }
      };
      window.onunhandledrejection = function(e) {
        var el = document.getElementById('error-overlay');
        if (el) { el.style.display = 'block'; el.innerHTML += '<div><b>Unhandled rejection:</b> ' + (e.reason?.message || e.reason) + '</div>'; }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
